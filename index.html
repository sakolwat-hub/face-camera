<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Face Recognition Camera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{font-family:'Sarabun',sans-serif;background:#0a0a0a;color:#fff;height:100%;overflow:hidden}
    .app{display:flex;flex-direction:column;height:100%;height:100dvh}
    .header{padding:8px 12px;background:linear-gradient(135deg,#7c3aed,#4f46e5);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
    .header h1{font-size:14px;font-weight:700}
    .header .sub{font-size:10px;opacity:.7}
    .header .close{background:rgba(255,255,255,.15);border:none;color:#fff;width:32px;height:32px;border-radius:8px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .sbar{padding:5px 12px;font-size:11px;font-weight:600;display:flex;align-items:center;gap:6px;flex-shrink:0;transition:background .3s}
    .sbar.loading{background:#1e3a5f;color:#93c5fd}
    .sbar.ready{background:#14532d;color:#86efac}
    .sbar.matched{background:#166534;color:#4ade80}
    .sbar.mismatch{background:#7f1d1d;color:#fca5a5}
    .sbar.noface{background:#78350f;color:#fcd34d}
    .sbar .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
    .sbar.loading .dot,.sbar.ready .dot{animation:pd 1.5s ease-in-out infinite}
    @keyframes pd{0%,100%{opacity:1}50%{opacity:.3}}
    .cam{flex:1;position:relative;overflow:hidden;background:#000;min-height:0}
    #video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
    #overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
    .live{position:absolute;top:8px;left:8px;background:rgba(239,68,68,.85);backdrop-filter:blur(4px);padding:3px 8px;border-radius:20px;font-size:9px;font-weight:700;display:flex;align-items:center;gap:4px;z-index:10}
    .live .rd{width:5px;height:5px;background:#fca5a5;border-radius:50%;animation:pd 1s ease-in-out infinite}
    .mo{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;z-index:10;padding:0 12px}
    .mc{padding:10px 16px;border-radius:14px;backdrop-filter:blur(10px);display:flex;align-items:center;gap:10px;animation:su .3s ease;max-width:360px;width:100%}
    .mc.ok{background:rgba(22,163,74,.9)}.mc.warn{background:rgba(234,88,12,.9)}.mc.err{background:rgba(220,38,38,.9)}
    .mc .ico{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
    .mc .inf{flex:1}.mc .nm{font-size:13px;font-weight:800}.mc .dt{font-size:10px;opacity:.8;margin-top:1px}
    @keyframes su{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
    .ctrl{padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center;gap:16px;flex-shrink:0}
    .cap{width:62px;height:62px;border-radius:50%;border:3px solid rgba(255,255,255,.6);background:0 0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
    .cap:active{transform:scale(.9)}.cap:disabled{opacity:.3;cursor:not-allowed}
    .cap .inn{width:50px;height:50px;border-radius:50%;background:#fff;transition:background .2s}
    .cbtn{padding:12px 24px;border-radius:12px;border:none;font-size:14px;font-weight:800;font-family:'Sarabun',sans-serif;cursor:pointer;transition:all .15s;display:none}
    .cbtn:active{transform:scale(.95)}.cbtn.show{display:flex;align-items:center;gap:6px}
    .cbtn.ok{background:#22c55e;color:#fff}.cbtn.rt{background:rgba(255,255,255,.15);color:#fff}
    .ls{position:absolute;inset:0;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;gap:12px}
    .ls.h{display:none}
    .sp{width:36px;height:36px;border:3px solid rgba(124,58,237,.3);border-top-color:#7c3aed;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .ls p{font-size:13px;color:#a1a1aa}.ls .pt{font-size:11px;color:#71717a}
    .cp{position:absolute;inset:0;z-index:20;display:none}.cp.show{display:block}
    .cp img{width:100%;height:100%;object-fit:cover}
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <div><h1>Face Recognition</h1><div class="sub" id="hUser">กำลังเตรียมระบบ...</div></div>
    <button class="close" onclick="cancelAndClose()">&times;</button>
  </div>
  <div class="sbar loading" id="sbar"><span class="dot"></span><span id="sTxt">กำลังเตรียมระบบ...</span></div>
  <div class="cam">
    <div class="ls" id="ls"><div class="sp"></div><p id="lTxt">กำลังโหลด AI Models...</p><div class="pt" id="lProg">อาจใช้เวลา 5-10 วินาที</div></div>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div class="live" id="liveBadge" style="display:none"><span class="rd"></span> LIVE — ถ่ายสดเท่านั้น</div>
    <div class="mo" id="mo" style="display:none"></div>
    <div class="cp" id="cp"><img id="cpImg" src=""></div>
  </div>
  <div class="ctrl">
    <button class="cbtn rt" id="retryBtn" onclick="retryCapture()">↻ ถ่ายใหม่</button>
    <button class="cap" id="capBtn" disabled onclick="captureAndAnalyze()"><div class="inn"></div></button>
    <button class="cbtn ok" id="okBtn" onclick="confirmAndSend()">✓ ยืนยันเช็คอิน</button>
  </div>
</div>
<script>
var P=new URLSearchParams(location.search),ORIGIN=P.get('origin')||'*',UID=P.get('user_id')||'',UNAME=decodeURIComponent(P.get('user_name')||''),THR=parseFloat(P.get('threshold')||'0.45');
var faces=[],capB64=null,vStream=null,MURL='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model';
var vid=document.getElementById('video'),ov=document.getElementById('overlay');
document.getElementById('hUser').textContent=UNAME||'พนักงาน';

window.addEventListener('message',function(e){
  if(e.data&&e.data.type==='face_data'){
    faces=(e.data.faces||[]).map(function(f){return{userId:f.userId,userName:f.userName,descriptor:new Float32Array(f.descriptor)}});
    startSys();
  }
});
if(window.opener)window.opener.postMessage({type:'camera_ready'},ORIGIN);
setTimeout(function(){if(!faces.length)startSys()},5000);

async function startSys(){
  try{
    setSt('loading','กำลังโหลด AI Models...');
    document.getElementById('lTxt').textContent='กำลังโหลด AI Models...';
    await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(MURL),faceapi.nets.faceLandmark68Net.loadFromUri(MURL),faceapi.nets.faceRecognitionNet.loadFromUri(MURL)]);
    document.getElementById('lTxt').textContent='กำลังเปิดกล้อง...';
    document.getElementById('lProg').textContent='กรุณาอนุญาตการเข้าถึงกล้อง';
    var s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
    vStream=s;vid.srcObject=s;
    await new Promise(function(r){vid.onloadedmetadata=function(){vid.play();r()}});
    document.getElementById('ls').classList.add('h');
    document.getElementById('liveBadge').style.display='flex';
    document.getElementById('capBtn').disabled=false;
    if(faces.length>0){setSt('ready','พร้อมใช้งาน — พบ '+faces.length+' ใบหน้าในระบบ');startDet()}
    else setSt('noface','ไม่มีใบหน้าลงทะเบียน — ถ่ายรูปปกติ');
  }catch(e){
    document.getElementById('lTxt').textContent='เกิดข้อผิดพลาด';
    document.getElementById('lProg').textContent=e.name==='NotAllowedError'?'กรุณาอนุญาตการเข้าถึงกล้อง':e.message;
    setSt('mismatch','Error: '+e.message);
  }
}

var det=true,conM=0,lastMId=null,cfm=null;
async function startDet(){
  var ctx=ov.getContext('2d');
  async function loop(){
    if(!det||vid.paused||vid.ended){requestAnimationFrame(loop);return}
    ov.width=vid.videoWidth;ov.height=vid.videoHeight;ctx.clearRect(0,0,ov.width,ov.height);
    try{
      var r=await faceapi.detectSingleFace(vid,new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.5})).withFaceLandmarks().withFaceDescriptor();
      if(r){
        var b=r.detection.box,m=mf(r.descriptor),mx=ov.width-b.x-b.width;
        ctx.strokeStyle=m.matched?'#22c55e':'#f59e0b';ctx.lineWidth=3;ctx.strokeRect(mx,b.y,b.width,b.height);
        var lb=m.matched?m.userName+' ('+m.confidence+'%)':'กำลังตรวจสอบ... ('+m.confidence+'%)';
        ctx.font='bold 14px Sarabun,sans-serif';var lw=ctx.measureText(lb).width+16;
        ctx.fillStyle=m.matched?'#22c55e':'#f59e0b';ctx.fillRect(mx,b.y-28,lw,24);
        ctx.fillStyle='#fff';ctx.fillText(lb,mx+8,b.y-10);
        if(m.matched){if(m.userId===lastMId)conM++;else{conM=1;lastMId=m.userId}
          if(conM>=3&&!cfm){cfm=m;onCfm(m)}}
        else{conM=0;lastMId=null}
      }
    }catch(e){}
    setTimeout(function(){requestAnimationFrame(loop)},200);
  }
  loop();
}

function mf(d){
  if(!faces.length)return{matched:false,confidence:0};
  var best=null,bd=Infinity;
  for(var i=0;i<faces.length;i++){var dist=faceapi.euclideanDistance(d,faces[i].descriptor);if(dist<bd){bd=dist;best=faces[i]}}
  var c=Math.round((1-bd)*100);
  if(bd<=THR&&best)return{matched:true,userId:best.userId,userName:best.userName,distance:bd,confidence:c};
  return{matched:false,distance:bd,confidence:c};
}

function onCfm(m){
  if(m.userId===UID){setSt('matched','✓ ยืนยันตัวตน: '+m.userName+' ('+m.confidence+'%)');sMC('ok','✓',m.userName,'ยืนยันตัวตนสำเร็จ ('+m.confidence+'%)')}
  else{setSt('mismatch','✗ ใบหน้าไม่ตรง — ตรวจพบ: '+m.userName);sMC('err','✗','ใบหน้าไม่ตรงกับผู้ใช้','ตรวจพบ: '+m.userName+' | ล็อกอิน: '+UNAME);cfm=null}
}

async function captureAndAnalyze(){
  det=false;
  var c=document.createElement('canvas');c.width=vid.videoWidth;c.height=vid.videoHeight;var x=c.getContext('2d');
  x.translate(c.width,0);x.scale(-1,1);x.drawImage(vid,0,0);x.setTransform(1,0,0,1,0,0);
  var bH=Math.max(28,c.height*.05);x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,c.height-bH,c.width,bH);
  var now=new Date(),ts=now.toLocaleString('th-TH',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  var fs=Math.max(10,bH*.45);x.font='bold '+fs+'px Sarabun,sans-serif';x.fillStyle='#fff';
  x.textAlign='left';x.fillText(UNAME,10,c.height-(bH/2)+(fs/3));
  x.textAlign='right';x.fillText(ts,c.width-10,c.height-(bH/2)+(fs/3));
  capB64=c.toDataURL('image/jpeg',.85);
  document.getElementById('cpImg').src=capB64;document.getElementById('cp').classList.add('show');
  if(!cfm&&faces.length>0){
    setSt('loading','กำลังวิเคราะห์ใบหน้า...');
    try{
      var img=new Image();img.src=capB64;await new Promise(function(r){img.onload=r});
      var res=await faceapi.detectSingleFace(img,new faceapi.TinyFaceDetectorOptions({inputSize:416,scoreThreshold:.5})).withFaceLandmarks().withFaceDescriptor();
      if(res){var mt=mf(res.descriptor);if(mt.matched){cfm=mt;onCfm(mt)}else{setSt('noface','ไม่พบใบหน้าที่ตรงกัน ('+mt.confidence+'%)');sMC('warn','?','ไม่พบใบหน้าที่ตรงกัน','ความใกล้เคียง '+mt.confidence+'% — ถ่ายใหม่')}}
      else{setSt('noface','ไม่พบใบหน้าในภาพ');sMC('warn','!','ไม่พบใบหน้าในภาพ','กรุณาถ่ายใหม่ให้เห็นหน้าชัดเจน')}
    }catch(e){}
  }
  document.getElementById('retryBtn').classList.add('show');
  if(cfm&&cfm.userId===UID){document.getElementById('okBtn').classList.add('show');document.getElementById('capBtn').style.display='none'}
}

function retryCapture(){
  document.getElementById('cp').classList.remove('show');capB64=null;cfm=null;conM=0;lastMId=null;
  document.getElementById('mo').style.display='none';
  document.getElementById('retryBtn').classList.remove('show');document.getElementById('okBtn').classList.remove('show');
  document.getElementById('capBtn').style.display='';det=true;
  if(faces.length>0)setSt('ready','พร้อมใช้งาน — หันหน้าเข้ากล้อง');
}

function confirmAndSend(){
  var r={type:'face_result',success:true,matched:!!cfm,userId:cfm?cfm.userId:'',userName:cfm?cfm.userName:'',confidence:cfm?cfm.confidence:0,capturedImage:capB64,timestamp:Date.now()};
  if(window.opener)window.opener.postMessage(r,ORIGIN);
  setTimeout(function(){window.close()},500);
}

function cancelAndClose(){
  if(window.opener)window.opener.postMessage({type:'face_result',success:false,cancelled:true},ORIGIN);
  stopCam();window.close();
}

function setSt(t,txt){document.getElementById('sbar').className='sbar '+t;document.getElementById('sTxt').textContent=txt}
function sMC(t,ico,nm,dt){var el=document.getElementById('mo');el.style.display='flex';el.innerHTML='<div class="mc '+t+'"><div class="ico">'+ico+'</div><div class="inf"><div class="nm">'+nm+'</div><div class="dt">'+dt+'</div></div></div>'}
function stopCam(){det=false;if(vStream){vStream.getTracks().forEach(function(t){t.stop()});vStream=null}}
window.addEventListener('beforeunload',stopCam);
</script>
</body>
</html>
